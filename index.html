<!DOCTYPE html>

<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">


<title>
SunWah Inventory
</title>


<link rel="stylesheet"
href="style.css">


<link rel="manifest"
href="manifest.json">


<meta name="theme-color"
content="#b71c1c">


</head>


<body>


<div class="app">


<header>

<div class="logo">
SW
</div>


<h1>
SunWah Supermarket
</h1>


<p>
Inventory System
</p>


</header>



<section class="dashboard">


<div class="card">

<h3>
📦
</h3>

<p>
入貨
</p>

</div>



<div class="card">

<h3>
📤
</h3>

<p>
出貨
</p>

</div>



<div class="card">

<h3>
🔍
</h3>

<p>
查庫存
</p>

</div>



<div class="card">

<h3>
📋
</h3>

<p>
盤點
</p>

</div>



<div class="card warning">

<h3>
⚠️
</h3>

<p>
提醒
</p>

</div>



<div class="card">

<h3>
⚙️
</h3>

<p>
設定
</p>

</div>



</section>



<section class="status">


<h2>
今日狀態
</h2>


<div class="status-box">

<p>
📦 今日入貨：
<span id="stockIn">
0
</span>
</p>


<p>
📤 今日出貨：
<span id="stockOut">
0
</span>
</p>


<p>
⚠️ 需要提醒：
<span id="alerts">
0
</span>
</p>


</div>


</section>



</div>



<script src="app.js"></script>


<script>

if(
"serviceWorker" in navigator
){

navigator.serviceWorker.register(
"service-worker.js"
);

}

</script>


</body>

</html>
