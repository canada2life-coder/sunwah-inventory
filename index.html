<!DOCTYPE html>

<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
SunWah Inventory Pro
</title>


<link rel="stylesheet" href="style.css">

<link rel="manifest" href="manifest.json">


<meta name="theme-color" content="#b71c1c">


</head>


<body>


<div class="app">


<header>


<div class="logo">
SW
</div>


<h1>
SunWah Inventory
</h1>


<p>
Supermarket Stock System
</p>


</header>



<section class="menu">


<button onclick="openScanner()">

📷
<br>
掃描商品

</button>



<button onclick="openStockIn()">

📦
<br>
入貨

</button>



<button onclick="openStockOut()">

📤
<br>
出貨

</button>



<button onclick="openSearch()">

🔍
<br>
查庫存

</button>



<button onclick="openProducts()">

📋
<br>
商品管理

</button>



<button onclick="openCount()">

📝
<br>
盤點

</button>



<button onclick="openAlerts()">

⚠️
<br>
提醒

</button>



<button onclick="openSettings()">

⚙️
<br>
設定

</button>


</section>



<section class="dashboard">


<h2>
今日狀態
</h2>


<div class="info">


<p>
📦 商品數量：
<span id="totalProducts">
0
</span>
</p>


<p>
⚠️ 低庫存：
<span id="lowStock">
0
</span>
</p>


<p>
⏰ 快到期：
<span id="expiryCount">
0
</span>
</p>


</div>


</section>



</div>




<script src="database.js"></script>

<script src="app.js"></script>


<script>

if(
"serviceWorker" in navigator
){

navigator.serviceWorker.register(
"service-worker.js"
);

}

</script>


</body>

</html>
